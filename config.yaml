# Configuración del vigilante de stock de PS5
# ------------------------------------------------------------
# Avisa por Telegram cuando una PS5 NUEVA (no seminueva/reacondicionada)
# está disponible para comprar con envío en España por <= max_price.

max_price: 700          # € — avisa si el precio es igual o menor
min_price: 250          # € — por debajo es casi seguro un accesorio o un error, se ignora
realert_hours: 12       # si sigue disponible, vuelve a recordártelo cada X horas (0 = nunca)
health_alert_after: 8   # avisa (una vez) si una tienda falla X ejecuciones seguidas
max_products_per_store: 20
page_timeout_s: 45

# Tipos de tienda (mode):
#   product      -> descubre fichas de producto desde las páginas de "discover"
#                   (enlaces que cumplan link_pattern) y abre cada ficha para leer
#                   precio y disponibilidad (JSON-LD schema.org, botón de compra...).
#   cards        -> lee directamente las tarjetas de una página de resultados
#                   (para webs cuyos resultados no son enlaces, p. ej. Carrefour).
#   chollometro  -> lee los chollos activos (no caducados) de Chollometro.
#
# group: home -> la revisa el runner de tu PC (workflow ps5-stock-home.yml); sin group -> GitHub.
# max_price por tienda sobrescribe el global. enabled: false la desactiva.

stores:
  - id: eci
    group: home   # bloquea a GitHub: se revisa desde tu PC
    name: El Corte Inglés
    mode: product
    discover:
      - https://www.elcorteingles.es/videojuegos/ps5/consolas/
    link_pattern: 'elcorteingles\.es/videojuegos/A\d+-'
    products:
      - https://www.elcorteingles.es/videojuegos/A200069099-consola-playstation-5-digital/
      - https://www.elcorteingles.es/videojuegos/A200069098-consola-playstation-5-chasis-e-1tb/

  - id: mediamarkt
    group: home   # bloquea a GitHub: se revisa desde tu PC
    name: MediaMarkt
    mode: product
    discover:
      - https://www.mediamarkt.es/es/search.html?query=consola%20ps5
    link_pattern: 'mediamarkt\.es/es/product/_'
    products:
      - https://www.mediamarkt.es/es/product/_consola-sony-ps5-slim-digital-edition-825-gb-ssd-4k-1-mando-chasis-e-blanco-pack-fortnite-flowering-chaos-codigo-de-descarga-1608846.html

  - id: sony
    name: PlayStation (tienda oficial de Sony)
    mode: product
    ignore_ld: true   # su schema.org dice InStock aunque ponga "No disponible para comprar"
    discover:
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/digital-edition-825-gb-two-dualsense-bundle/
    link_pattern: 'playstation\.com/es-es/ps5/.+/product/'
    products:
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/digital-edition-825-gb-two-dualsense-bundle/
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/marvels-wolverine-battle-yellow-limited-edition-bundle/
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/ea-sports-fc-26-bundle/
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/fortnite-flowering-chaos-bundle/
    wait_s: 5

  - id: sony_pc
    group: home   # copia desde tu PC por si Sony bloquea a GitHub
    name: PlayStation (Sony, desde mi PC)
    mode: product
    ignore_ld: true   # su schema.org dice InStock aunque ponga "No disponible para comprar"
    discover:
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/digital-edition-825-gb-two-dualsense-bundle/
    link_pattern: 'playstation\.com/es-es/ps5/.+/product/'
    products:
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/digital-edition-825-gb-two-dualsense-bundle/
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/marvels-wolverine-battle-yellow-limited-edition-bundle/
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/ea-sports-fc-26-bundle/
      - https://www.playstation.com/es-es/ps5/digital-edition-825-gb/product/fortnite-flowering-chaos-bundle/
    wait_s: 5

  - id: game
    name: GAME
    mode: product
    discover:
      - https://www.game.es/resultados?search=consola%20PS5
    link_pattern: '^https://www\.game\.es/[a-z0-9-]+/\d{5,7}$'

  - id: xtralife
    name: Xtralife
    mode: product
    discover:
      - https://www.xtralife.com/seleccion/consolas-ps5-estandar/7867
      - https://www.xtralife.com/buscar/consola%20ps5
    link_pattern: 'xtralife\.com/producto/consola-ps5'

  - id: pccomponentes
    group: home   # bloquea a GitHub: se revisa desde tu PC
    name: PcComponentes
    mode: cards
    # El buscador solo muestra lo que tiene stock: si aparece una PS5, es que ha repuesto
    url: https://www.pccomponentes.com/search/?query=sony+playstation+5+consola
    card_selector: 'a[href*="/sony-playstation-5"]'
    wait_s: 6
    watch_all: true   # avisa de las PS5 disponibles aunque pasen de max_price, cuando cambia su precio

  - id: amazon
    name: Amazon.es
    mode: product
    discover:
      - https://www.amazon.es/s?k=consola+playstation+5&i=videogames
    link_pattern: 'amazon\.es/.*?/?dp/[A-Z0-9]{10}'
    products:   # fichas principales de PS5 en Amazon.es (vendidas por Amazon cuando hay stock)
      - https://www.amazon.es/dp/B0FP2S1MNB   # PS5 estándar Chassis E
      - https://www.amazon.es/dp/B0CLTBHXWQ   # PS5 Digital Slim
      - https://www.amazon.es/dp/B0CLT54ZNZ   # PS5 estándar Slim
      - https://www.amazon.es/dp/B0DXL6Z2X1   # pack Astro Bot
      - https://www.amazon.es/dp/B08KKJ37F7   # PS5 estándar
      - https://www.amazon.es/dp/B08KJF2D25   # PS5 Digital
    # Amazon solo cuenta si lo vende Amazon o un vendedor con envío a España
    # (el filtro de precio ya descarta a los revendedores de 1.000 €+)

  - id: carrefour
    group: home   # bloquea a GitHub: se revisa desde tu PC
    name: Carrefour
    mode: product
    # El buscador de Carrefour no carga en el bot; sus páginas de categoría sí tienen enlaces normales
    discover:
      - https://www.carrefour.es/gaming/consolas-ps5/F-13riiZ1pt4/c
      - https://www.carrefour.es/gaming/ofertas-gaming/oferta-consolas-playstation-5/cat3391673/c
    link_pattern: 'carrefour\.es/[a-z0-9-]+/[A-Z0-9]+-\d+/p$'
    wait_s: 5

  - id: hipercor
    group: home
    name: Hipercor
    mode: product
    discover:
      - https://www.hipercor.es/videojuegos/ps5/consolas/
    link_pattern: 'hipercor\.es/videojuegos/A\d+-'

  - id: eroski
    group: home
    name: Eroski
    mode: product
    discover:
      - https://supermercado.eroski.es/es/search/results/?q=consola%20ps5
    link_pattern: 'eroski\.es/es/productdetail/'

  - id: coolmod
    group: home
    name: Coolmod
    mode: product
    discover:
      - https://www.coolmod.com/playstation-5/
      - https://www.coolmod.com/gamers-consolas-consolas/
    link_pattern: '^https://www\.coolmod\.com/(sony-)?(consola|playstation|ps5)[a-z0-9-]*/?$'

  - id: aliexpress
    group: home   # bloquea a GitHub: se revisa desde tu PC
    name: AliExpress (envío desde España)
    mode: cards
    url: https://es.aliexpress.com/w/wholesale-consola-ps5.html?shipFromCountry=ES&sortType=price_asc&minPrice=250
    card_selector: 'a[href*="/item/"]'
    wait_s: 7
    note: 'Precio sin cupones; con cupón puede bajar más. Comprueba que el vendedor sea la tienda oficial o una tienda conocida.'

  - id: amazon_fr
    group: home   # desde GitHub no devuelve resultados
    name: Amazon Francia
    mode: product
    discover:
      - https://www.amazon.fr/s?k=console+playstation+5&i=videogames
    link_pattern: 'amazon\.fr/.*?/?dp/[A-Z0-9]{10}'
    note: 'Amazon Francia: comprueba que envía a España antes de comprar.'

  - id: amazon_it
    name: Amazon Italia
    mode: product
    discover:
      - https://www.amazon.it/s?k=console+playstation+5&i=videogames
    link_pattern: 'amazon\.it/.*?/?dp/[A-Z0-9]{10}'
    note: 'Amazon Italia: comprueba que envía a España antes de comprar.'

  - id: amazon_de
    group: home   # desde GitHub no devuelve resultados
    name: Amazon Alemania
    mode: product
    discover:
      - https://www.amazon.de/s?k=playstation+5+konsole&i=videogames
    link_pattern: 'amazon\.de/.*?/?dp/[A-Z0-9]{10}'
    note: 'Amazon Alemania: comprueba que envía a España antes de comprar.'

  - id: lidl
    name: Lidl
    mode: cards
    url: https://www.lidl.es/q/search?q=playstation%205
    empty_ok: true   # normalmente no tiene PS5; si aparece en el buscador, avisa
    wait_s: 5

  - id: alcampo
    group: home
    name: Alcampo
    mode: cards
    url: https://www.compraonline.alcampo.es/search?q=playstation%205
    empty_ok: true
    wait_s: 6

  - id: chollometro
    name: Chollometro
    mode: chollometro
    urls:
      - https://www.chollometro.com/categorias/ps5?sortBy=new
      - https://www.chollometro.com/search?q=consola%20ps5&sortBy=new
    note: 'Chollo publicado por la comunidad: abre el enlace y confirma la tienda.'

  # Fnac usa un captcha anti-bots (DataDome) que bloquea a GitHub Actions casi siempre.
  - id: fnac
    name: Fnac
    enabled: false
    mode: product
    discover:
      - https://www.fnac.es/SearchResult/ResultList.aspx?Search=consola+ps5
    link_pattern: 'fnac\.es/a\d+/'
