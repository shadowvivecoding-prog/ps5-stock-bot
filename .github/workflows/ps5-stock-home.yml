name: Vigilar stock PS5 (mi PC)

# Tiendas que bloquean a GitHub (group: home en config.yaml).
# Se ejecuta en el runner instalado en tu PC con Windows, con tu conexión de casa.
# Si el PC está apagado, la ejecución espera en cola; solo se guarda una pendiente.

on:
  schedule:
    # Cada ejecución se queda ~5h40m comprobando cada 10 min; el cron solo la relanza.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Revisar solo estas tiendas (ids separados por comas, vacío = todas las de casa)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ps5-stock-home
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 350
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar stock (cada 10 min durante ~5h40m)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          PS5_GROUP: home
          PS5_STATE_PATH: state-home.json
          PYTHONIOENCODING: utf-8
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          git config user.name "ps5-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          function Save-State {
            if (git status --porcelain state-home.json) {
              git add state-home.json
              git commit -q -m "Actualizar estado (PC) [skip ci]"
              git pull -q --rebase --autostash
              git push -q
            }
          }
          $only = "${{ inputs.only }}"
          if ($only) { python check_stock.py --only $only; Save-State; exit 0 }
          $end = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $end) {
            $start = Get-Date
            python check_stock.py
            try { Save-State } catch { Write-Host "No se pudo guardar estado" }
            $wait = 600 - ((Get-Date) - $start).TotalSeconds
            if ($wait -lt 30) { $wait = 30 }
            Start-Sleep -Seconds ([int]$wait)
          }
