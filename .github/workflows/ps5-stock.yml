name: Vigilar stock PS5 (GitHub)

on:
  schedule:
    # GitHub se salta muchos crons cortos, así que cada ejecución se queda
    # ~5h40m comprobando cada 10 min. El cron horario solo la relanza si muere.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_aviso:
        description: "Enviar solo un aviso de prueba a Discord"
        type: boolean
        default: false
      only:
        description: "Revisar solo estas tiendas (ids separados por comas, vacío = todas)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ps5-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Comprobar stock (cada 10 min durante ~5h40m)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTICE: ${{ inputs.test_aviso }}
          PS5_GROUP: cloud
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name "ps5-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save_state() {
            if [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -q -m "Actualizar estado del vigilante [skip ci]"
              git pull -q --rebase --autostash || true
              git push -q || true
            fi
          }
          if [ -n "$ONLY" ] || [ "$TEST_NOTICE" = "true" ]; then
            if [ -n "$ONLY" ]; then python check_stock.py --only "$ONLY"; else python check_stock.py; fi
            [ "$TEST_NOTICE" = "true" ] || save_state
            exit 0
          fi
          end=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $end ]; do
            start=$(date +%s)
            python check_stock.py || echo "Fallo en esta ronda, sigo"
            save_state
            sleep $(( 600 - ($(date +%s) - start) > 30 ? 600 - ($(date +%s) - start) : 30 ))
          done
