name: Vigilar stock PS5 (GitHub)

on:
  schedule:
    # Cada 10 minutos, todo el día (GitHub puede retrasar algunas ejecuciones unos minutos)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_aviso:
        description: "Enviar solo un aviso de prueba a Discord"
        type: boolean
        default: false
      only:
        description: "Revisar solo estas tiendas (ids separados por comas, vacío = todas)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ps5-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Comprobar stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          # Opcional: si además quieres Telegram, crea estos dos secretos
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTICE: ${{ inputs.test_aviso }}
          PS5_GROUP: cloud
        run: python check_stock.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Guardar estado (para no repetir avisos)
        if: ${{ always() && inputs.test_aviso != true }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ps5-stock-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar estado del vigilante [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
